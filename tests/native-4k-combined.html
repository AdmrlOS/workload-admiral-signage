<!doctype html><meta charset="utf-8"><title>Native 4K combined path control</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:white;font:60px sans-serif}video{position:absolute;inset:0;width:100%;height:100%}#label{position:absolute;left:60px;top:60px;background:#1645a0;padding:20px}#square{position:absolute;top:250px;width:500px;height:500px;background:#ffe600;will-change:transform}</style>
<video src="/media/demo-4k-hevc.mp4" autoplay muted loop playsinline></video><div id="label"></div><div id="square"></div>
<script>const v=document.querySelector('video'),label=document.querySelector('#label'),square=document.querySelector('#square');let n=0;function tick(t){square.style.transform=`translateX(${100+(t/10)%2800}px)`;label.textContent=`CSS ${innerWidth}×${innerHeight} DPR ${devicePixelRatio} · UI ${++n} · video ${v.currentTime.toFixed(2)}`;requestAnimationFrame(tick)}requestAnimationFrame(tick);v.play().catch(console.error);</script>
